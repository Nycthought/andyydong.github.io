<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animations</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
  <style>
    :root{
      --color-bg: #FFFFFF;
      --color-text: #1A1A1A;
      --color-muted: #6B6B6B;
      --color-accent: #2255FF;
      --color-border: #E5E5E5;
      --color-card: #F7F7F7;
      --font-body: 'Inter', -apple-system, sans-serif;
      --font-serif: 'Newsreader', Georgia, serif;
      --max-width: 880px;
      --radius: 4px;
    }

    body{
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

   align-items: start;.work-grid{
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: clamp(260px, 36vw, 520px);
      gap: 32px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding: 0 32px;
    }
    .work-grid::-webkit-scrollbar { display: none; }
    .work-grid > * { scroll-snap-align: start; }

    .thumb{
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
    }

  .dreams{
  width: 100%;
  height: auto;
  max-height: 60vh;      /* never taller than 60% of the screen */
  object-fit: contain;   /* shows the whole drawing, no cropping */
  display: block;
  margin: 0 auto;
  
    }

    .work-grid h3{ font-size: 1.05rem; font-weight: 600; margin: 0 0 4px; }
    .work-grid p{ color: var(--color-muted); font-size: 0.92rem; margin: 0; }
  </style>
</head>

  <body>
  <section class="section" id="work">
    <div class="wrap">
      <h1>Animations</h1>
      <p class="section-intro"></p>

        
        <div class="Dreams">
          <video controls width= "480" preload="metadata">
          <source src="images/Dream4.mp4">
            </div>
      <h2>Animations</h2>
        <h3>[Animation]</h3>
        <p>[Animation - drawn frame-by-frame in Procreate Dreams.]</p>
      </div>



  
</body>
