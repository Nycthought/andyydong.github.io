<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artworks</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
  <style>
    :root{
      --color-bg: #FFFFFF;
      --color-text: #1A1A1A;
      --color-muted: #6B6B6B;
      --color-accent: #2255FF;
      --color-border: #E5E5E5;
      --color-card: #F7F7F7;
      --font-body: 'Inter', -apple-system, sans-serif;
      --font-serif: 'Newsreader', Georgia, serif;
      --max-width: 880px;
      --radius: 4px;
    }

    body{
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

   .work-grid{
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: clamp(260px, 36vw, 520px);
      align-items: start;
      gap: 32px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding: 0 32px;
    }
    .work-grid::-webkit-scrollbar { display: none; }
    .work-grid > * { scroll-snap-align: start; }

    .thumb{
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
    }

  .dreams{
  width: 100%;
  height: auto;
  max-height: 60vh;      /* never taller than 60% of the screen */
  object-fit: contain;   /* shows the whole drawing, no cropping */
  display: block;
  margin: 0 auto;
  
    }

    .work-grid h3{ font-size: 1.05rem; font-weight: 600; margin: 0 0 4px; }
    .work-grid p{ color: var(--color-muted); font-size: 0.92rem; margin: 0; }
  </style>
</head>

  
<body>
  <section class="section" id="work">
    <div class="wrap">
      <h2>Artwork</h2>
      <p class="section-intro"></p>

      <div class="work-grid">

        <div class="dreams">
          <div class=thumb"><img class="dreams" src="images/girl.jpg" alt="girl"></div>
          <h3>Untitled</h3>
          <p>Digital - 2026</p>
        </div>
        
        <div class="dreams">
          <div class="thumb"><img class="dreams" src="images/Sep26.jpeg" alt="Dreams on the shelf"></div>
          <h3>Shelf Decor</h3>
          <p>Digital - 2026</p>
        </div>

        <div class="dreams">
          <div class="thumb"><img class="dreams" src="images/feet.jpg" alt="Cuties"></div>
          <h3>Cuties</h3>
          <p>Digital - 2026</p>
        </div>

        <div class="dreams">
          <div class="thumb"><img class="dreams" src="images/booty.JPG" alt="Untitled"></div>
          <h3>Untitled</h3>
          <p>Digital - 2026</p>
        </div>
        
        <div class="dreams">
          <div class="thumb"><img class="dreams" src="images/flowers.jpg" alt="flowers"></div>
          <h3>Untitled</h3>
          <p>Digital - 2026</p>
        </div>

        <div class="dreams">
          <div class="thumb"><img class="dreams" src="images/tiles.jpg" alt="tiles."></div>
          <h3>Tiles</h3>
          <p>Digital - 2026</p>
        
        
    

      </div>
    </div>
  </section>
</body>
</html>
