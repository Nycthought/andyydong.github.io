<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artwork — Andy Dong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg: #FFFFFF;
    --color-text: #1A1A1A;
    --color-muted: #6B6B6B;
    --color-accent: #2255FF;
    --color-border: #E5E5E5;
    --color-card: #F7F7F7;
    --font-body: 'Inter', -apple-system, sans-serif;
    --max-width: 1040px;
    --radius: 4px;
    --grid-gap: 20px;
  }

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    line-height: 1.6;
    font-size: 17px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  img{ max-width: 100%; display: block; }
  a{ color: var(--color-accent); }
  .wrap{ max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }

  /* ---------- TOP BAR ---------- */
  header.nav{
    border-bottom: 1px solid var(--color-border);
    background: var(--color-bg);
  }
  .nav-inner{
    max-width: var(--max-width); margin: 0 auto; padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-inner a{ text-decoration: none; color: var(--color-text); font-size: 0.95rem; }
  .nav-inner a.name{ font-weight: 600; }
  .nav-inner a:hover{ color: var(--color-accent); }

  /* ---------- PAGE ---------- */
  .section{ padding: 48px 0 72px; }
  .section h2{ font-size: 1.75rem; font-weight: 700; margin: 0 0 8px; }
  .section-intro{ color: var(--color-muted); margin: 0 0 28px; max-width: 60ch; }

  /* ---------- GALLERY (masonry: shows each piece uncropped) ---------- */
  /* Change column-width to make thumbnails bigger or smaller */
  .gallery{
    column-width: 260px;
    column-gap: var(--grid-gap);
  }
  .g-item{
    display: block; width: 100%;
    break-inside: avoid;
    margin: 0 0 var(--grid-gap); padding: 0; border: 0; background: none;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .g-thumb{
    position: relative;
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .g-thumb img,
  .g-thumb video{
    display: block;
    width: 100%; height: auto;
    transition: transform 0.35s ease;
  }
  .g-item:hover .g-thumb img,
  .g-item:hover .g-thumb video,
  .g-item:focus-visible .g-thumb img,
  .g-item:focus-visible .g-thumb video{ transform: scale(1.04); }
  .g-item:focus-visible{ outline: 2px solid var(--color-accent); outline-offset: 4px; border-radius: var(--radius); }
  .g-item h3{ font-size: 1.02rem; font-weight: 600; margin: 10px 0 2px; }
  .g-item p{ color: var(--color-muted); font-size: 0.9rem; margin: 0; }

  .g-badge{
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.7); color: #fff;
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em;
    padding: 3px 8px; border-radius: var(--radius);
    pointer-events: none;
  }

  /* ---------- LIGHTBOX ---------- */
  .lb{
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10,10,14,0.92);
    display: none; align-items: center; justify-content: center;
    padding: 56px 64px;
  }
  .lb.open{ display: flex; }
  .lb-figure{ margin: 0; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .lb-stage{ display: flex; align-items: center; justify-content: center; }
  .lb-media{
    display: block;
    width: auto; height: auto;
    max-width: calc(100vw - 128px);
    max-height: calc(100vh - 190px);
    object-fit: contain; border-radius: var(--radius);
  }
  .lb-cap{ color: #fff; text-align: center; max-width: 60ch; }
  .lb-cap strong{ display: block; font-weight: 600; }
  .lb-cap span{ color: #B5B5C0; font-size: 0.9rem; }
  .lb button{
    position: absolute; background: rgba(255,255,255,0.1); color: #fff;
    border: 0; width: 44px; height: 44px; border-radius: 50%;
    font-size: 1.4rem; cursor: pointer; line-height: 1;
  }
  .lb button:hover{ background: rgba(255,255,255,0.22); }
  .lb-close{ top: 16px; right: 16px; }
  .lb-prev{ left: 12px; top: 50%; transform: translateY(-50%); }
  .lb-next{ right: 12px; top: 50%; transform: translateY(-50%); }
  .lb-count{ position: absolute; top: 24px; left: 24px; color: #B5B5C0; font-size: 0.85rem; }

  footer{
    padding: 32px 0; border-top: 1px solid var(--color-border);
    color: var(--color-muted); font-size: 0.85rem; text-align: center;
  }

  /* ---------- DARK MODE ---------- */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --color-bg: #14141A; --color-text: #F2F2F2; --color-muted: #9A9AA5;
      --color-border: #2A2A32; --color-card: #1E1E26;
    }
  }
  :root[data-theme="dark"]{
    --color-bg: #14141A; --color-text: #F2F2F2; --color-muted: #9A9AA5;
    --color-border: #2A2A32; --color-card: #1E1E26;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 640px){
    .gallery{ column-width: auto; column-count: 2; column-gap: 14px; }
    .g-item{ margin-bottom: 14px; }
    .lb{ padding: 64px 12px; }
    .lb-media{ max-width: calc(100vw - 24px); }
    .lb-prev{ top: auto; bottom: 16px; left: 24px; transform: none; }
    .lb-next{ top: auto; bottom: 16px; right: 24px; transform: none; }
  }
  @media (prefers-reduced-motion: reduce){
    .g-thumb img, .g-thumb video{ transition: none; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="name" href="index.html">ANDY DONG</a>
    <a href="index.html#work">← Back to home</a>
  </div>
</header>

<section class="section" id="work">
  <div class="wrap">

          <video src="images/Dream4.mp4#t=0.1" muted playsinline preload="metadata"></video>
          <span class="g-badge">▶ VIDEO</span>
        </div>
