<style>
  :root{
    --color-bg: #FFFFFF;
    --color-text: #1A1A1A;
    --color-muted: #6B6B6B;
    --color-accent: #2255FF;
    --color-border: #E5E5E5;
    --color-card: #F7F7F7;
    --font-body: 'Inter', -apple-system, sans-serif;
    --max-width: 1040px;
    --radius: 4px;
    --grid-gap: 20px;
  }

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    line-height: 1.6;
    font-size: 17px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  img{ max-width: 100%; display: block; }
  a{ color: var(--color-accent); }
  .wrap{ max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }

  /* ---------- TOP BAR ---------- */
  header.nav{
    border-bottom: 1px solid var(--color-border);
    background: var(--color-bg);
  }
  .nav-inner{
    max-width: var(--max-width); margin: 0 auto; padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-inner a{ text-decoration: none; color: var(--color-text); font-size: 0.95rem; }
  .nav-inner a.name{ font-weight: 600; }
  .nav-inner a:hover{ color: var(--color-accent); }

  /* ---------- PAGE ---------- */
  .section{ padding: 48px 0 72px; }
  .section h2{ font-size: 1.75rem; font-weight: 700; margin: 0 0 8px; }
  .section-intro{ color: var(--color-muted); margin: 0 0 28px; max-width: 60ch; }

  /* ---------- GALLERY (masonry: shows each drawing uncropped) ---------- */
  /* Change column-width to make thumbnails bigger or smaller */
  .gallery{
    column-width: 260px;
    column-gap: var(--grid-gap);
  }
  .g-item{
    display: block; width: 100%;
    break-inside: avoid;
    margin: 0 0 var(--grid-gap); padding: 0; border: 0; background: none;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .g-thumb{
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .g-thumb img{
    width: 100%; height: auto;
    transition: transform 0.35s ease;
  }
  .g-item:hover .g-thumb img,
  .g-item:focus-visible .g-thumb img{ transform: scale(1.04); }
  .g-item:focus-visible{ outline: 2px solid var(--color-accent); outline-offset: 4px; border-radius: var(--radius); }
  .g-item h3{ font-size: 1.02rem; font-weight: 600; margin: 10px 0 2px; }
  .g-item p{ color: var(--color-muted); font-size: 0.9rem; margin: 0; }

  /* ---------- LIGHTBOX ---------- */
  .lb{
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10,10,14,0.92);
    display: none; align-items: center; justify-content: center;
    padding: 56px 64px;
  }
  .lb.open{ display: flex; }
  .lb-figure{ margin: 0; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .lb-media{ max-width: 100%; max-height: calc(100vh - 190px); object-fit: contain; border-radius: var(--radius); }
  .lb-cap{ color: #fff; text-align: center; max-width: 60ch; }
  .lb-cap strong{ display: block; font-weight: 600; }
  .lb-cap span{ color: #B5B5C0; font-size: 0.9rem; }
  .lb button{
    position: absolute; background: rgba(255,255,255,0.1); color: #fff;
    border: 0; width: 44px; height: 44px; border-radius: 50%;
    font-size: 1.4rem; cursor: pointer; line-height: 1;
  }
  .lb button:hover{ background: rgba(255,255,255,0.22); }
  .lb-close{ top: 16px; right: 16px; }
  .lb-prev{ left: 12px; top: 50%; transform: translateY(-50%); }
  .lb-next{ right: 12px; top: 50%; transform: translateY(-50%); }
  .lb-count{ position: absolute; top: 24px; left: 24px; color: #B5B5C0; font-size: 0.85rem; }

  footer{
    padding: 32px 0; border-top: 1px solid var(--color-border);
    color: var(--color-muted); font-size: 0.85rem; text-align: center;
  }

  /* ---------- DARK MODE ---------- */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --color-bg: #14141A; --color-text: #F2F2F2; --color-muted: #9A9AA5;
      --color-border: #2A2A32; --color-card: #1E1E26;
    }
  }
  :root[data-theme="dark"]{
    --color-bg: #14141A; --color-text: #F2F2F2; --color-muted: #9A9AA5;
    --color-border: #2A2A32; --color-card: #1E1E26;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 640px){
    .gallery{ column-width: auto; column-count: 2; column-gap: 14px; }
    .g-item{ margin-bottom: 14px; }
    .lb{ padding: 64px 12px; }
    .lb-prev{ top: auto; bottom: 16px; left: 24px; transform: none; }
    .lb-next{ top: auto; bottom: 16px; right: 24px; transform: none; }
  }
  @media (prefers-reduced-motion: reduce){
    .g-thumb img{ transition: none; }
  }
</style>

<!-- ================= LIGHTBOX ================= -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Artwork viewer" hidden>
  <div class="lb-count" id="lb-count"></div>
  <button class="lb-close" id="lb-close" aria-label="Close">✕</button>
  <button class="lb-prev" id="lb-prev" aria-label="Previous">‹</button>
  <figure class="lb-figure">
    <img class="lb-media" id="lb-img" alt="">
    <figcaption class="lb-cap"><strong id="lb-title"></strong><span id="lb-desc"></span></figcaption>
  </figure>
  <button class="lb-next" id="lb-next" aria-label="Next">›</button>
</div>

<script>
(function(){
  var lb = document.getElementById('lb');
  var img = document.getElementById('lb-img');
  var titleEl = document.getElementById('lb-title');
  var descEl = document.getElementById('lb-desc');
  var countEl = document.getElementById('lb-count');
  var items = Array.prototype.slice.call(document.querySelectorAll('[data-gallery] .g-item'));
  var index = 0, lastFocus = null;

  items.forEach(function(btn, i){
    btn.addEventListener('click', function(){ lastFocus = btn; open(i); });
  });

  function render(){
    var it = items[index];
    img.src = it.dataset.src;
    img.alt = it.dataset.title || '';
    titleEl.textContent = it.dataset.title || '';
    descEl.textContent = it.dataset.desc || '';
    countEl.textContent = (index + 1) + ' / ' + items.length;
  }
  function open(i){
    index = i; render();
    lb.hidden = false; lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('lb-close').focus();
  }
  function close(){
    lb.classList.remove('open'); lb.hidden = true;
    img.removeAttribute('src');
    document.body.style.overflow = '';
    if(lastFocus) lastFocus.focus();
  }
  function step(d){
    index = (index + d + items.length) % items.length;
    render();
  }

  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('lb-next').addEventListener('click', function(){ step(1); });
  lb.addEventListener('click', function(e){ if(e.target === lb) close(); });
  document.addEventListener('keydown', function(e){
    if(lb.hidden) return;
    if(e.key === 'Escape') close();
    else if(e.key === 'ArrowLeft') step(-1);
    else if(e.key === 'ArrowRight') step(1);
  });
  
  // Hover-to-preview for video thumbnails
  document.querySelectorAll('.g-item[data-type="video"]').forEach(function(btn){
    var v = btn.querySelector('video');
    if(!v) return;
    btn.addEventListener('mouseenter', function(){ v.play().catch(function(){}); });
    btn.addEventListener('mouseleave', function(){ v.pause(); v.currentTime = 0.1; });
  });
  var sx = null;
  lb.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', function(e){
    if(sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    if(Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
    sx = null;
  });
})();
</script>
