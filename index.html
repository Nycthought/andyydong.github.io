<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Andy Dong</title>
</head>
<body>
    
    <div class="Andy">
    <h1>Andy Dong </h1>
</div>
    <h1> ✨ Spotify ✨</h1>
    <button id="login-btn">Login with Spotify</button>
    <div id="profile-data"></div>

    <script>
        // Configuration
        const CLIENT_ID = 'YOUR_SPOTIFY_CLIENT_ID'; // Replace with your actual Client ID
        const REDIRECT_URI = window.location.origin + window.location.pathname; 
        const SCOPES = 'user-read-private user-read-email';

        const loginBtn = document.getElementById('login-btn');
        const profileDataDiv = document.getElementById('profile-data');

        // 1. Redirect user to Spotify Login
        loginBtn.addEventListener('click', () => {
            const authUrl = `https://spotify.com{CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}&response_type=token&show_dialog=true`;
            window.location.href = authUrl;
        });

        // 2. Parse the Access Token from the URL hash after redirect
        function getAccessTokenFromUrl() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return params.get('access_token');
        }

        // 3. Fetch data using the token
        async function fetchSpotifyProfile(token) {
            const response = await fetch('https://spotify.com', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            
            // Clean hash from URL bar
            window.location.hash = '';
            
            // Display data
            loginBtn.style.display = 'none';
            profileDataDiv.innerHTML = `
                <h2>Welcome, ${data.display_name}!</h2>
                <p>Email: ${data.email}</p>
                <img src="${data.images[0]?.url || ''}" alt="Profile Image" width="150">
            `;
        }

        // Execution Check
        const token = getAccessTokenFromUrl();
        if (token) {
            fetchSpotifyProfile(token);
        }
    </script>
